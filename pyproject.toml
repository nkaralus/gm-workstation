[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-workstation"
version = "0.1.0"
description = "Local, high-velocity tabletop GM workstation: FastAPI + SQLite WAL + offline Qwen parser"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10",                  # map import: normalises .jpg/.webp uploads to PNG
]

[project.optional-dependencies]
# pip install -e ".[llm]"      offline directive parsing (needs a C/C++ toolchain or a prebuilt wheel)
llm = ["llama-cpp-python>=0.2.90", "huggingface-hub>=0.23"]
# pip install -e ".[images]"   Imagen 3 token portraits
images = ["google-genai>=0.8"]

[project.scripts]
gm-workstation = "app:main"

[tool.setuptools]
py-modules = ["app", "engine", "database", "parser", "gemini_client"]
